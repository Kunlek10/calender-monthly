<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <title>Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" width="40" height="40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <rect width="24" height="24" rx="3" fill="#fff" stroke="#dadce0" stroke-width="1"/>
          <rect x="0" y="0" width="24" height="7" rx="3" fill="#1a73e8"/>
          <rect x="0" y="4" width="24" height="3" fill="#1a73e8"/>
          <text x="12" y="18" text-anchor="middle" font-family="Google Sans,sans-serif" font-size="9" font-weight="500" fill="#3c4043" id="logo-day"></text>
        </svg>
        <span class="logo-text">Calendar</span>
      </div>
    </div>

    <div class="topbar-center">
      <button id="btn-today" class="btn-today">Today</button>
      <button id="btn-prev" class="icon-btn" aria-label="Previous month">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z" fill="currentColor"/></svg>
      </button>
      <button id="btn-next" class="icon-btn" aria-label="Next month">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z" fill="currentColor"/></svg>
      </button>
      <h1 id="month-title" class="month-title" aria-live="polite" aria-atomic="true"></h1>
    </div>

    <div class="topbar-right">
      <button class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/></svg>
      </button>
      <button class="avatar" aria-label="Account menu">K</button>
    </div>
  </header>

  <div class="app-body">

    <!-- Sidebar -->
    <aside class="sidebar">
      <button id="btn-add" class="create-btn" aria-label="Create event">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/></svg>
        <span>Create</span>
      </button>

      <!-- Mini calendar -->
      <div class="mini-cal">
        <div class="mini-cal-header">
          <span id="mini-month-title" class="mini-month-title"></span>
          <div class="mini-nav">
            <button id="mini-prev" class="mini-nav-btn" aria-label="Previous">&#8249;</button>
            <button id="mini-next" class="mini-nav-btn" aria-label="Next">&#8250;</button>
          </div>
        </div>
        <div class="mini-dow" role="row" aria-label="Days of week">
          <span aria-label="Sunday">S</span><span aria-label="Monday">M</span><span aria-label="Tuesday">T</span><span aria-label="Wednesday">W</span><span aria-label="Thursday">T</span><span aria-label="Friday">F</span><span aria-label="Saturday">S</span>
        </div>
        <div id="mini-grid" class="mini-grid"></div>
      </div>
    </aside>

    <!-- Main calendar -->
    <main class="cal-main">
      <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="Monthly calendar"></div>
    </main>

  </div>

  <!-- Event Modal -->
  <dialog id="event-modal" class="event-modal" aria-modal="true" aria-labelledby="modal-heading">
    <div class="modal-inner">
      <div class="modal-topbar">
        <h2 id="modal-heading" class="modal-title">Add Event</h2>
        <button type="button" id="btn-modal-close" class="icon-btn modal-close-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>
        </button>
      </div>

      <form id="event-form" novalidate>
        <div class="field title-field">
          <label for="f-title" class="sr-only">Event title (required)</label>
          <input id="f-title" name="title" type="text" maxlength="120" autocomplete="off" placeholder="Add title" class="title-input" aria-describedby="err-title" aria-required="true" />
          <span class="err" id="err-title" role="alert"></span>
        </div>

        <div class="field-row time-row">
          <svg viewBox="0 0 24 24" width="20" height="20" class="field-icon" aria-hidden="true" focusable="false"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z" fill="#70757a"/></svg>
          <div class="time-inputs">
            <label for="f-date" class="sr-only">Date (required)</label>
            <input id="f-date" name="date" type="date" class="date-input" aria-describedby="err-date" aria-required="true" />
            <div class="time-pair">
              <label for="f-start" class="sr-only">Start time</label>
              <input id="f-start" name="startTime" type="time" class="time-input" aria-describedby="err-time" />
              <span class="time-sep" aria-hidden="true">–</span>
              <label for="f-end" class="sr-only">End time</label>
              <input id="f-end" name="endTime" type="time" class="time-input" />
            </div>
          </div>
        </div>
        <span class="err" id="err-date" role="alert" style="margin-left:28px"></span>
        <span class="err" id="err-time" role="alert" style="margin-left:28px"></span>

        <div class="field desc-field">
          <svg viewBox="0 0 24 24" width="20" height="20" class="field-icon" aria-hidden="true" focusable="false"><path d="M3 18h12v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="#70757a"/></svg>
          <label for="f-desc" class="sr-only">Description</label>
          <textarea id="f-desc" name="description" rows="2" maxlength="500" placeholder="Add description"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-delete" class="btn-delete" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/></svg>
            Delete
          </button>
          <div class="modal-actions-right">
            <button type="button" id="btn-cancel" class="btn-secondary">Cancel</button>
            <button type="submit" id="btn-save" class="btn-primary">Save</button>
          </div>
        </div>
      </form>
    </div>
  </dialog>

  <script src="main.js"></script>
</body>
</html>
